<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="The layout of form contact">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <link rel="icon" type="image/png" sizes="32x32" href="./assets/images/favicon-32x32.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bai+Jamjuree:ital,wght@0,200;0,300;0,400;0,500;0,600;0,700;1,200;1,300;1,400;1,500;1,600;1,700&family=Barlow+Semi+Condensed:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&family=DM+Sans:ital,opsz,wght@0,9..40,100..1000;1,9..40,100..1000&family=Fraunces:ital,opsz,wght@0,9..144,100..900;1,9..144,100..900&family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Karla:ital,wght@0,200..800;1,200..800&family=Montserrat:ital,wght@0,100..900;1,100..900&family=Nunito:ital,wght@0,200..1000;1,200..1000&family=Open+Sans:ital,wght@0,300..800;1,300..800&family=Outfit:wght@100..900&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&family=Raleway:ital,wght@0,100..900;1,100..900&family=Sora:wght@100..800&family=Young+Serif&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="Reset/reset.css">
  <link rel="stylesheet" href="CSS/style.css">
  <script type="module" src="script/script.js" defer></script>
  <script type="module" src="script/main.js" defer></script>
  <title>Frontend Mentor | Contact form</title>
</head>
<body>
  <main class="main">
    <h1 class="main__title">Form Contact</h1>
    <section class="section" aria-label="section">
      <form action="" class="form">
        <h2 class="form__title">Contact Us</h2>
        <section class="form__name" aria-label="name">
          <label>
            <span>First Name <span class="span">*</span></span>
            <input type="text" name="first" id="first">
            <p class="errorFirstName" aria-live="polite">This field is required</p>
          </label>
          <label>
            <span>Last Name <span class="span">*</span></span>
            <input type="text" name="last" id="last">
            <p class="errorLastName" aria-live="polite">This field is required</p>
          </label>
        </section>
        <section class="form__email" aria-label="email">
          <label>
            <span>Email Address <span class="span">*</span></span>
            <input type="email" name="email" id="email">
            <p class="errorEmail" aria-live="polite">Please enter a valid email address</p>
          </label>
        </section>
        <section class="form__query" aria-label="query">
          <p class="query__title">Query Type <span class="span">*</span></p>
          <div class="form__radio">
            <label>
              <input type="radio" name="radio" class="radio" id="general" value="general">
              <span class="span__radio"></span>
              General Enquiry
            </label>
            <label>
              <input type="radio" name="radio" class="radio" id="support" value="support">
              <span class="span__radio"></span>
              Support Request
            </label>
          </div>
          <p class="errorQuery" aria-live="polite">Please select a query type</p>
        </section>
        <section class="form__message">
          <label for="message">Message <span class="span">*</span></label>
          <textarea name="message" id="message" autocorrect="on" cols="20" rows="5"></textarea>
          <p class="errorMessage" aria-live="polite">This field is required</p>
        </section>
        <section class="contacted" aria-label="contacted">
          <label>
            <input type="checkbox" name="contacted" id="contacted">
            <span class="span__checkbox"></span>
            I consent to being contacted by the team
          </label>
          <p class="errorContacted" aria-live="polite">To submit this form, please consent to being contacted</p>
        </section>
        <button type="submit" class="submit">Submit</button>
      </form>
      <section class="success" aria-label="success">
        <strong>
          <img src="assets/images/icon-success-check.svg" alt="">
          Message Sent!
        </strong>
        <p class="successMessage">Thanks for completing the form. We'll be in touch soon!</p>
      </section>
    </section>
  </main>
  <footer class="attribution">
    Challenge by <a href="https://www.frontendmentor.io?ref=challenge">Frontend Mentor</a>. 
    Coded by <a href="https://github.com/Harena-debug">Harena</a>.
  </footer>
</body>
</html>
